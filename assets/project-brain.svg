<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0C1324" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="pBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="batteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#247BFF" />
      <stop offset="100%" stop-color="#FF354F" />
    </linearGradient>

    <pattern id="pGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247BFF" opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', sans-serif; font-size: 20px; font-weight: 800; fill: #F3F5FA; }
    .sub-title { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #247BFF; letter-spacing: 1.5px; }
    .label-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 600; fill: #9AA8BD; }
    .val-text { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #00C6FF; }
    .wave-line { animation: waveAnim 3s ease-in-out infinite alternate; }
    @keyframes waveAnim { 0% { opacity: 0.5; } 100% { opacity: 1; filter: drop-shadow(0 0 6px #247BFF); } }
  </style>

  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#pBg)" />
  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#pGrid)" />
  <rect x="5" y="5" width="840" height="310" rx="16" fill="none" stroke="url(#pBorder)" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" class="sub-title">FEATURED SYSTEM ARCHITECTURE</text>
    <text x="0" y="24" class="title-text">BRAIN — Battery Risk &amp; Analytics Intelligence Network</text>
  </g>

  <!-- Left Side Battery & Waveform Visualization -->
  <g transform="translate(40, 85)">
    <!-- Battery Shell -->
    <rect x="0" y="0" width="280" height="180" rx="12" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1.5" />
    <!-- Battery Terminal Cap -->
    <rect x="280" y="60" width="10" height="60" rx="3" fill="#247BFF" />

    <!-- Inner Battery Cells with Heatmap Colors -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="50" height="140" rx="6" fill="#10B981" opacity="0.8" />
      <rect x="60" y="0" width="50" height="140" rx="6" fill="#247BFF" opacity="0.8" />
      <rect x="120" y="0" width="50" height="140" rx="6" fill="#F59E0B" opacity="0.8" />
      <rect x="180" y="0" width="50" height="140" rx="6" fill="#FF354F" opacity="0.8" />
    </g>

    <!-- Simulated Telemetry Signal Wave -->
    <path d="M 20 90 Q 50 40 80 90 T 140 90 T 200 90 T 260 90" stroke="#00C6FF" stroke-width="2.5" fill="none" class="wave-line" />
  </g>

  <!-- Right Side Analytics Panel -->
  <g transform="translate(360, 85)">
    <rect x="0" y="0" width="450" height="180" rx="12" fill="#0F192E" stroke="rgba(255, 53, 79, 0.3)" stroke-width="1.5" />

    <g transform="translate(25, 25)">
      <text x="0" y="0" class="label-text">PHYSICS-INFORMED NEURAL NETWORK (PINN)</text>
      <text x="0" y="20" class="val-text">Real-Time State of Charge (SOC) &amp; Health (SOH) Prediction</text>

      <line x1="0" y1="36" x2="400" y2="36" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="58" class="label-text">TELEMETRY INGESTION ENGINE</text>
      <text x="0" y="76" class="val-text">Web Bluetooth (BLE GATT API) Zero-State Ingestion</text>

      <line x1="0" y1="92" x2="400" y2="92" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="114" class="label-text">3D DIGITAL TWIN &amp; STRESS SIMULATOR</text>
      <text x="0" y="132" class="val-text">Three.js WebGL Heatmap Rendering &amp; Extreme Load Tests</text>
    </g>
  </g>
</svg>