<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 330" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0C1324" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F3F5FA" />
      <stop offset="100%" stop-color="#247BFF" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247BFF" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF354F" />
      <stop offset="100%" stop-color="#FF6B81" />
    </linearGradient>

    <linearGradient id="monogramGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#00C6FF" />
    </linearGradient>

    <radialGradient id="coreDiscGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#121D38" />
      <stop offset="70%" stop-color="#091022" />
      <stop offset="100%" stop-color="#050814" />
    </radialGradient>

    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="techGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247BFF" opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .greeting-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #FF354F;
      text-transform: uppercase;
    }

    .name-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 34px;
      font-weight: 800;
      fill: url(#nameGrad);
      letter-spacing: -0.5px;
    }

    .role-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 16px;
      font-weight: 700;
      fill: url(#roleGrad);
    }

    .pitch-title {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 13px;
      font-weight: 700;
      fill: #F3F5FA;
    }

    .sub-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #9AA8BD;
      line-height: 1.5;
    }

    .badge-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #FFFFFF;
    }

    .status-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 10.5px;
      font-weight: 700;
      fill: #10B981;
    }

    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }

    .float-avatar {
      animation: floatAnim 4s infinite ease-in-out;
    }

    .monogram-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: 2.5px;
      fill: url(#monogramGrad);
    }

    .card-meta-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.4px;
      fill: #64748B;
      text-transform: uppercase;
    }

    .card-status-text {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 8.5px;
      font-weight: 700;
      letter-spacing: 0.8px;
      fill: #10B981;
      text-transform: uppercase;
    }

    .signal-ring {
      animation: ringPulse 3s infinite ease-in-out;
      transform-origin: 0px 0px;
    }

    .orbit-ring {
      animation: ringRotate 14s infinite linear;
      transform-origin: 0px 0px;
    }

    @keyframes ringPulse {
      0%, 100% { opacity: 0.25; transform: scale(0.96); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }

    @keyframes ringRotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes floatAnim {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .pulse-dot, .float-avatar, .signal-ring, .orbit-ring {
        animation: none;
      }
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="320" rx="16" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="840" height="320" rx="16" fill="url(#techGrid)" />
  <rect x="5" y="5" width="840" height="320" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Ambient Glow -->
  <circle cx="710" cy="90" r="110" fill="#247BFF" opacity="0.08" filter="url(#blueGlow)" />
  <circle cx="140" cy="250" r="80" fill="#FF354F" opacity="0.05" filter="url(#blueGlow)" />

  <!-- LEFT COLUMN -->
  <g transform="translate(35, 36)">
    <!-- Terminal Header Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="195" height="26" rx="13" fill="rgba(255, 53, 79, 0.12)" stroke="rgba(255, 53, 79, 0.3)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#FF354F" class="pulse-dot" />
      <text x="26" y="17" class="greeting-text">⚡ HELLO WORLD, I'M</text>
    </g>

    <!-- Name & Role -->
    <text x="0" y="68" class="name-text">SANKET CHUTE</text>
    <text x="0" y="96" class="role-text">SOFTWARE ENGINEER</text>
    <text x="0" y="116" class="greeting-text" fill="#9AA8BD">AI/ML • FULL-STACK DEVELOPMENT</text>

    <!-- One-Line Pitch -->
    <text x="0" y="146" class="pitch-title">Architecting deterministic AI engines &amp; cyber-physical digital twins.</text>
    <text x="0" y="168" class="sub-text">B.Tech Artificial Intelligence Student (RTMNU • CGPA: 8.2)</text>
    <text x="0" y="188" class="sub-text">Core Specialization: Machine Learning, PINN Physics AI &amp; Full-Stack Systems</text>

    <!-- Active Status Pill -->
    <g transform="translate(0, 218)">
      <rect x="0" y="0" width="350" height="28" rx="14" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.35)" stroke-width="1" />
      <circle cx="14" cy="14" r="4" fill="#10B981" class="pulse-dot" />
      <text x="26" y="18" class="status-text">Active Systems: BRAIN (PINN/BLE), CampusSync &amp; PlaceTrack AI</text>
    </g>
  </g>

  <!-- RIGHT COLUMN (Developer ID Card) -->
  <g transform="translate(590, 25)">
    <g class="float-avatar">
      <!-- Card Container & Cyber Border -->
      <rect x="0" y="0" width="190" height="270" rx="16" fill="#0D1527" stroke="rgba(36, 123, 255, 0.35)" stroke-width="1.5" />

      <!-- Top Micro Accent & Identity Label -->
      <line x1="75" y1="12" x2="115" y2="12" stroke="rgba(36, 123, 255, 0.4)" stroke-width="2" stroke-linecap="round" />
      <text x="95" y="27" class="card-meta-text" text-anchor="middle">IDENTITY // CORE</text>

      <!-- Center Technical Emblem & Signal Rings -->
      <g transform="translate(95, 106)">
        <!-- Ambient Backlight -->
        <circle cx="0" cy="0" r="50" fill="#247BFF" opacity="0.12" filter="url(#blueGlow)" />
        <circle cx="0" cy="0" r="28" fill="#FF354F" opacity="0.08" filter="url(#blueGlow)" />

        <!-- Outer Pulsing Signal Ring -->
        <circle cx="0" cy="0" r="62" fill="none" stroke="rgba(36, 123, 255, 0.35)" stroke-width="1.2" stroke-dasharray="4,4" class="signal-ring" />

        <!-- Rotating Technical Orbit Ring -->
        <circle cx="0" cy="0" r="52" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="14,8,4,8" class="orbit-ring" />

        <!-- Reticle Crosshair Ticks -->
        <line x1="0" y1="-58" x2="0" y2="-52" stroke="#247BFF" stroke-width="1.5" />
        <line x1="0" y1="52" x2="0" y2="58" stroke="#FF354F" stroke-width="1.5" />
        <line x1="-58" y1="0" x2="-52" y2="0" stroke="#247BFF" stroke-width="1.5" />
        <line x1="52" y1="0" x2="58" y2="0" stroke="#247BFF" stroke-width="1.5" />

        <!-- Diagonal Tech Corner Nodes -->
        <circle cx="-42" cy="-42" r="1.5" fill="#00C6FF" opacity="0.7" />
        <circle cx="42" cy="-42" r="1.5" fill="#00C6FF" opacity="0.7" />
        <circle cx="-42" cy="42" r="1.5" fill="#FF354F" opacity="0.7" />
        <circle cx="42" cy="42" r="1.5" fill="#00C6FF" opacity="0.7" />

        <!-- Core Badge Disc -->
        <circle cx="0" cy="0" r="40" fill="url(#coreDiscGrad)" stroke="rgba(36, 123, 255, 0.7)" stroke-width="1.5" />
        <circle cx="0" cy="0" r="36" fill="none" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1" stroke-dasharray="3,3" />

        <!-- Monogram "SC" (Optically Centered) -->
        <text x="0" y="1" class="monogram-text" text-anchor="middle" dominant-baseline="central">SC</text>
      </g>

      <!-- Middle Status Indicator -->
      <g transform="translate(95, 186)">
        <rect x="-65" y="-10" width="130" height="20" rx="10" fill="rgba(36, 123, 255, 0.08)" stroke="rgba(36, 123, 255, 0.3)" stroke-width="1" />
        <circle cx="-48" cy="0" r="3" fill="#10B981" class="pulse-dot" />
        <text x="-38" y="3.5" class="card-status-text">SYSTEM // ONLINE</text>
      </g>

      <!-- Bottom Verified Developer Badge -->
      <rect x="20" y="215" width="150" height="28" rx="14" fill="url(#badgeGrad)" />
      <text x="95" y="233" class="badge-text" text-anchor="middle">@sanketchute17</text>
    </g>
  </g>
</svg>