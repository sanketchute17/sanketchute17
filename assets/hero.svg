<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16" />
      <stop offset="50%" stop-color="#0c1324" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ff354f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#247bff" />
    </linearGradient>

    <linearGradient id="roleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f" />
      <stop offset="100%" stop-color="#ff6b81" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247bff" opacity="0.15" />
    </pattern>
  </defs>

  <style>
    .greeting-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #ff354f;
      text-transform: uppercase;
      animation: fadeIn 1s ease-out forwards;
    }

    .name-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: url(#nameGrad);
      animation: slideUp 1.2s ease-out forwards;
    }

    .role-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 20px;
      font-weight: 700;
      fill: url(#roleGrad);
      letter-spacing: 0.5px;
    }

    .sub-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13.5px;
      fill: #94a3b8;
      line-height: 1.6;
    }

    .badge-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }

    .tag-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #cbd5e1;
    }

    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }

    .float-avatar {
      animation: float 4s infinite ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .greeting-text, .name-text, .pulse-dot, .float-avatar {
        animation: none;
      }
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="330" rx="16" fill="url(#bgGrad)" />
  <rect x="5" y="5" width="840" height="330" rx="16" fill="url(#dotPattern)" />
  <rect x="5" y="5" width="840" height="330" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Background Decorative Glowing Orbs -->
  <circle cx="700" cy="80" r="100" fill="#247bff" opacity="0.08" filter="url(#blueGlow)" />
  <circle cx="150" cy="280" r="80" fill="#ff354f" opacity="0.05" filter="url(#blueGlow)" />

  <!-- Left Content Area -->
  <g transform="translate(45, 45)">
    <!-- Terminal Header / Greeting Badge -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="26" rx="13" fill="rgba(255, 53, 79, 0.12)" stroke="rgba(255, 53, 79, 0.3)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#ff354f" class="pulse-dot" />
      <text x="26" y="17" class="greeting-text">⚡ HELLO WORLD, I'M</text>
    </g>

    <!-- Name Reveal -->
    <text x="0" y="72" class="name-text">Sanket Chute</text>

    <!-- Professional Role -->
    <text x="0" y="104" class="role-text">AI/ML Engineer &amp; Full-Stack Developer</text>

    <!-- Short Introduction -->
    <text x="0" y="134" class="sub-text">B.Tech Artificial Intelligence Student (RTMNU CGPA: 8.2)</text>
    <text x="0" y="154" class="sub-text">Specializing in Physics-Informed Neural Networks, Web Bluetooth Telemetry,</text>
    <text x="0" y="174" class="sub-text">and Production-Grade Full-Stack Cloud Architectures.</text>

    <!-- Location & Status Pills -->
    <g transform="translate(0, 202)">
      <!-- Location Pill -->
      <rect x="0" y="0" width="220" height="32" rx="8" fill="rgba(36, 123, 255, 0.1)" stroke="rgba(36, 123, 255, 0.3)" stroke-width="1" />
      <!-- Location Icon SVG inline -->
      <path d="M 16 10 C 12.7 10 10 12.7 10 16 C 10 20.5 16 26 16 26 C 16 26 22 20.5 22 16 C 22 12.7 19.3 10 16 10 Z M 16 18 C 14.9 18 14 17.1 14 16 C 14 14.9 14.9 14 16 14 C 17.1 14 18 14.9 18 16 C 18 17.1 17.1 18 16 18 Z" fill="#247bff" transform="translate(4, -2)" />
      <text x="34" y="20" class="tag-text">Nagpur, India • Open to Relocation</text>

      <!-- Status Pill -->
      <g transform="translate(232, 0)">
        <rect x="0" y="0" width="220" height="32" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#10b981" class="pulse-dot" />
        <text x="28" y="20" class="tag-text">Building CampusSync &amp; BRAIN</text>
      </g>
    </g>
  </g>

  <!-- Right Side Avatar Card Visual -->
  <g transform="translate(620, 50)" class="float-avatar">
    <!-- Card Frame -->
    <rect x="0" y="0" width="180" height="230" rx="16" fill="#0d1527" stroke="rgba(36, 123, 255, 0.3)" stroke-width="1.5" />
    
    <!-- Outer Orbit Ring -->
    <circle cx="90" cy="100" r="72" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Developer Avatar Embedded Vector -->
    <g transform="translate(20, 30)">
      <!-- Shoulders -->
      <path d="M 25 110 Q 70 85 115 110 C 118 120 105 130 70 130 C 35 130 22 120 25 110 Z" fill="#131f37" stroke="#247bff" stroke-width="1" />
      <circle cx="70" cy="115" r="3" fill="#ff354f" />
      <!-- Head -->
      <path d="M 40 55 C 40 28 100 28 100 55 C 100 78 86 85 70 85 C 54 85 40 78 40 55 Z" fill="#0f192e" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
      <!-- Visor -->
      <path d="M 42 48 C 48 44 92 44 98 48 C 101 54 99 62 96 64 C 80 67 60 67 44 64 C 41 62 39 54 42 48 Z" fill="url(#roleGrad)" filter="url(#blueGlow)" />
      <!-- Headphone Pads -->
      <rect x="34" y="46" width="6" height="16" rx="2" fill="#ff354f" />
      <rect x="100" y="46" width="6" height="16" rx="2" fill="#247bff" />
    </g>

    <!-- Handle / ID Label -->
    <rect x="25" y="185" width="130" height="26" rx="13" fill="url(#badgeGrad)" />
    <text x="90" y="202" class="badge-text" text-anchor="middle">@sanketchute17</text>
  </g>
</svg>
