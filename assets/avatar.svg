<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>
    
    <linearGradient id="avatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>
    
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="50%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .pulse-ring {
      animation: ringPulse 3s infinite ease-in-out;
      transform-origin: center;
    }
    .visor-glow {
      animation: visorScan 2.5s infinite alternate ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-ring, .visor-glow { animation: none; }
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.03); opacity: 0.9; }
    }
    @keyframes visorScan {
      0% { opacity: 0.7; filter: drop-shadow(0 0 2px #247bff); }
      100% { opacity: 1; filter: drop-shadow(0 0 8px #ff354f); }
    }
  </style>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#avatarBg)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#avatarGlow)" stroke-width="3" class="pulse-ring" />

  <!-- Outer Tech Orbit Dots -->
  <circle cx="100" cy="12" r="3" fill="#247bff" />
  <circle cx="188" cy="100" r="3" fill="#ff354f" />
  <circle cx="100" cy="188" r="3" fill="#247bff" />
  <circle cx="12" cy="100" r="3" fill="#ff354f" />

  <!-- Avatar Silhouette Group -->
  <g transform="translate(0, 10)">
    <!-- Shoulders / Hood -->
    <path d="M 45 155 Q 100 120 155 155 C 160 170 140 180 100 180 C 60 180 40 170 45 155 Z" fill="#131f37" stroke="#247bff" stroke-width="1.5" />
    
    <!-- Chest Core Indicator -->
    <circle cx="100" cy="155" r="5" fill="#ff354f" filter="url(#glow)" />

    <!-- Head Base -->
    <path d="M 65 85 C 65 50 135 50 135 85 C 135 115 115 125 100 125 C 85 125 65 115 65 85 Z" fill="#0f192e" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

    <!-- Cyber Visor / Headset -->
    <path d="M 68 75 C 75 70 125 70 132 75 C 136 82 134 92 130 94 C 110 98 90 98 70 94 C 66 92 64 82 68 75 Z" fill="url(#visorGrad)" class="visor-glow" filter="url(#glow)" />
    
    <!-- Visor Tech Grid Detail -->
    <line x1="75" y1="84" x2="125" y2="84" stroke="#ffffff" stroke-width="1" opacity="0.6" stroke-dasharray="3,2" />

    <!-- Headphones / Ear Elements -->
    <rect x="58" y="72" width="8" height="24" rx="4" fill="#ff354f" />
    <rect x="134" y="72" width="8" height="24" rx="4" fill="#247bff" />
  </g>
</svg>
