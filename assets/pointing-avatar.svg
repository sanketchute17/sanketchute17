<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pAvatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#070b16" />
    </linearGradient>
    
    <linearGradient id="pAvatarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>
    
    <linearGradient id="pVisorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="50%" stop-color="#247bff" />
      <stop offset="100%" stop-color="#ff354f" />
    </linearGradient>

    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .hand-point {
      animation: pointPulse 2s infinite ease-in-out;
      transform-origin: 130px 140px;
    }
    .laser-beam {
      animation: beamScan 2s infinite ease-in-out;
    }
    @media (prefers-reduced-motion: reduce) {
      .hand-point, .laser-beam { animation: none; }
    }
    @keyframes pointPulse {
      0%, 100% { transform: translateX(0); }
      50% { transform: translateX(6px); }
    }
    @keyframes beamScan {
      0%, 100% { opacity: 0.3; stroke-width: 2; }
      50% { opacity: 0.9; stroke-width: 4; }
    }
  </style>

  <!-- Background Base -->
  <rect width="200" height="200" rx="100" fill="url(#pAvatarBg)" />
  <circle cx="100" cy="100" r="96" fill="none" stroke="url(#pAvatarGlow)" stroke-width="3" />

  <!-- Avatar Group -->
  <g transform="translate(-10, 5)">
    <!-- Shoulders & Torso -->
    <path d="M 40 155 Q 90 125 140 155 C 145 170 125 180 90 180 C 50 180 35 170 40 155 Z" fill="#131f37" stroke="#247bff" stroke-width="1.5" />
    
    <!-- Chest Core -->
    <circle cx="85" cy="155" r="4" fill="#ff354f" filter="url(#pGlow)" />

    <!-- Head Base -->
    <path d="M 55 85 C 55 50 120 50 120 85 C 120 115 105 125 88 125 C 72 125 55 115 55 85 Z" fill="#0f192e" stroke="rgba(255,255,255,0.15)" stroke-width="2" />

    <!-- Visor -->
    <path d="M 58 75 C 65 70 112 70 118 75 C 122 82 120 92 116 94 C 98 98 80 98 60 94 C 56 92 54 82 58 75 Z" fill="url(#pVisorGrad)" filter="url(#pGlow)" />
    
    <!-- Headphones -->
    <rect x="49" y="72" width="7" height="22" rx="3" fill="#ff354f" />
    <rect x="119" y="72" width="7" height="22" rx="3" fill="#247bff" />

    <!-- Extended Pointing Arm and Hand -->
    <g class="hand-point">
      <!-- Arm -->
      <path d="M 125 140 Q 145 135 160 132" stroke="#131f37" stroke-width="14" stroke-linecap="round" />
      <path d="M 125 140 Q 145 135 160 132" stroke="#247bff" stroke-width="2" fill="none" />
      <!-- Pointing Finger Hand -->
      <circle cx="162" cy="132" r="6" fill="#00c6ff" filter="url(#pGlow)" />
      <!-- Laser Pointing Line -->
      <line x1="168" y1="132" x2="195" y2="132" stroke="#00c6ff" stroke-linecap="round" class="laser-beam" />
    </g>
  </g>
</svg>
