<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="stBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0C1324" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="stBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.6" />
    </linearGradient>

    <pattern id="stDotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247BFF" opacity="0.1" />
    </pattern>

    <filter id="chipGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .section-title {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #FF354F;
      text-transform: uppercase;
    }
    .main-heading {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 20px;
      font-weight: 800;
      fill: #F3F5FA;
    }
    .cat-label {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      fill: #247BFF;
      letter-spacing: 0.5px;
    }
    .tech-chip {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #E2E8F0;
    }
    .orbit-line {
      animation: rotateOrbit 20s linear infinite;
      transform-origin: 675px 235px;
    }
    .pulse-node {
      animation: nodePulse 2.5s infinite ease-in-out;
    }
    @keyframes rotateOrbit {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes nodePulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit-line, .pulse-node { animation: none; }
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="410" rx="16" fill="url(#stBg)" />
  <rect x="5" y="5" width="840" height="410" rx="16" fill="url(#stDotPattern)" />
  <rect x="5" y="5" width="840" height="410" rx="16" fill="none" stroke="url(#stBorder)" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(35, 35)">
    <text x="0" y="0" class="section-title">TECHNICAL ECOSYSTEM</text>
    <text x="0" y="26" class="main-heading">Technologies &amp; Engineering Stack</text>
  </g>

  <!-- Left Side Categorized Stack Panel (Width x=35 to x=530) -->
  <g transform="translate(35, 95)">
    <!-- Category 1: Languages & Core -->
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="cat-label">LANGUAGES &amp; CORE CONCEPTS</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="72" height="26" rx="6" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1" />
        <text x="36" y="17" class="tech-chip" text-anchor="middle">Python</text>

        <rect x="78" y="0" width="94" height="26" rx="6" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1" />
        <text x="125" y="17" class="tech-chip" text-anchor="middle">JavaScript</text>

        <rect x="178" y="0" width="52" height="26" rx="6" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1" />
        <text x="204" y="17" class="tech-chip" text-anchor="middle">C++</text>

        <rect x="236" y="0" width="52" height="26" rx="6" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1" />
        <text x="262" y="17" class="tech-chip" text-anchor="middle">SQL</text>

        <rect x="294" y="0" width="52" height="26" rx="6" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1" />
        <text x="320" y="17" class="tech-chip" text-anchor="middle">DSA</text>
        
        <rect x="352" y="0" width="52" height="26" rx="6" fill="#0F192E" stroke="rgba(36, 123, 255, 0.4)" stroke-width="1" />
        <text x="378" y="17" class="tech-chip" text-anchor="middle">OOP</text>
      </g>
    </g>

    <!-- Category 2: Frontend Engineering -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" class="cat-label">FRONTEND DEVELOPMENT</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="82" height="26" rx="6" fill="#0F192E" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1" />
        <text x="41" y="17" class="tech-chip" text-anchor="middle">React.js</text>

        <rect x="88" y="0" width="70" height="26" rx="6" fill="#0F192E" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1" />
        <text x="123" y="17" class="tech-chip" text-anchor="middle">Flutter</text>

        <rect x="164" y="0" width="105" height="26" rx="6" fill="#0F192E" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1" />
        <text x="216" y="17" class="tech-chip" text-anchor="middle">Tailwind CSS</text>

        <rect x="275" y="0" width="56" height="26" rx="6" fill="#0F192E" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1" />
        <text x="303" y="17" class="tech-chip" text-anchor="middle">Vite</text>

        <rect x="337" y="0" width="120" height="26" rx="6" fill="#0F192E" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1" />
        <text x="397" y="17" class="tech-chip" text-anchor="middle">Responsive UI</text>
      </g>
    </g>

    <!-- Category 3: Backend & AI Services -->
    <g transform="translate(0, 112)">
      <text x="0" y="0" class="cat-label">BACKEND &amp; AI APIS</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="76" height="26" rx="6" fill="#0F192E" stroke="rgba(255, 53, 79, 0.4)" stroke-width="1" />
        <text x="38" y="17" class="tech-chip" text-anchor="middle">Node.js</text>

        <rect x="82" y="0" width="94" height="26" rx="6" fill="#0F192E" stroke="rgba(255, 53, 79, 0.4)" stroke-width="1" />
        <text x="129" y="17" class="tech-chip" text-anchor="middle">Express.js</text>

        <rect x="182" y="0" width="72" height="26" rx="6" fill="#0F192E" stroke="rgba(255, 53, 79, 0.4)" stroke-width="1" />
        <text x="218" y="17" class="tech-chip" text-anchor="middle">FastAPI</text>

        <rect x="260" y="0" width="90" height="26" rx="6" fill="#0F192E" stroke="rgba(255, 53, 79, 0.4)" stroke-width="1" />
        <text x="305" y="17" class="tech-chip" text-anchor="middle">REST APIs</text>

        <rect x="356" y="0" width="88" height="26" rx="6" fill="#0F192E" stroke="rgba(255, 53, 79, 0.4)" stroke-width="1" />
        <text x="400" y="17" class="tech-chip" text-anchor="middle">Socket.io</text>
      </g>
    </g>

    <!-- Category 4: Databases & Tools -->
    <g transform="translate(0, 168)">
      <text x="0" y="0" class="cat-label">DATABASES &amp; INFRASTRUCTURE TOOLS</text>
      <g transform="translate(0, 10)">
        <rect x="0" y="0" width="80" height="26" rx="6" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="40" y="17" class="tech-chip" text-anchor="middle">MongoDB</text>

        <rect x="86" y="0" width="62" height="26" rx="6" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="117" y="17" class="tech-chip" text-anchor="middle">MySQL</text>

        <rect x="154" y="0" width="52" height="26" rx="6" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="180" y="17" class="tech-chip" text-anchor="middle">Hive</text>

        <rect x="212" y="0" width="44" height="26" rx="6" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="234" y="17" class="tech-chip" text-anchor="middle">Git</text>

        <rect x="262" y="0" width="98" height="26" rx="6" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="311" y="17" class="tech-chip" text-anchor="middle">Cloudflare</text>

        <rect x="366" y="0" width="64" height="26" rx="6" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1" />
        <text x="398" y="17" class="tech-chip" text-anchor="middle">Vercel</text>
      </g>
    </g>
  </g>

  <!-- Orbit Diagram (Centered at x=675) -->
  <g transform="translate(675, 235)">
    <circle cx="0" cy="0" r="34" fill="#0D1527" stroke="#247BFF" stroke-width="2" filter="url(#chipGlow)" />
    <text x="0" y="4" class="cat-label" fill="#FFFFFF" text-anchor="middle" font-size="10.5px">AI + WEB</text>

    <circle cx="0" cy="0" r="60" fill="none" stroke="rgba(36, 123, 255, 0.35)" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(255, 53, 79, 0.3)" stroke-width="1.5" stroke-dasharray="8,6" />

    <g class="orbit-line">
      <circle cx="0" cy="-60" r="8" fill="#247BFF" class="pulse-node" />
      <circle cx="60" cy="0" r="7" fill="#00C6FF" class="pulse-node" />
      <circle cx="-60" cy="0" r="7" fill="#FF354F" class="pulse-node" />
      <circle cx="0" cy="60" r="8" fill="#10B981" class="pulse-node" />
      <circle cx="67" cy="-67" r="6" fill="#FF6B81" />
      <circle cx="-67" cy="67" r="6" fill="#247BFF" />
    </g>
  </g>
</svg>