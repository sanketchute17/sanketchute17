<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0C1324" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.4" />
    </linearGradient>

    <pattern id="cGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00C6FF" opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title-text { font-family: 'Segoe UI', sans-serif; font-size: 20px; font-weight: 800; fill: #F3F5FA; }
    .sub-title { font-family: 'Segoe UI', sans-serif; font-size: 12px; font-weight: 700; fill: #00C6FF; letter-spacing: 1.5px; }
    .label-text { font-family: 'Segoe UI', sans-serif; font-size: 11px; font-weight: 700; fill: #9AA8BD; }
    .val-text { font-family: 'Segoe UI', sans-serif; font-size: 13px; font-weight: 700; fill: #F3F5FA; }
    .node-pulse { animation: pulseNode 2.5s infinite ease-in-out; }
    @keyframes pulseNode { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; filter: drop-shadow(0 0 6px #00C6FF); } }
  </style>

  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#cBg)" />
  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#cGrid)" />
  <rect x="5" y="5" width="840" height="310" rx="16" fill="none" stroke="url(#cBorder)" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" class="sub-title">FEATURED ACADEMIC PLATFORM</text>
    <text x="0" y="24" class="title-text">CampusSync / RAISONI-PEERSPACE</text>
  </g>

  <!-- Left Campus AI Ecosystem Diagram -->
  <g transform="translate(40, 85)">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#0F192E" stroke="rgba(0, 198, 255, 0.4)" stroke-width="1.5" />

    <!-- Central AI Node -->
    <g transform="translate(150, 90)">
      <circle cx="0" cy="0" r="32" fill="#070B16" stroke="#00C6FF" stroke-width="2" class="node-pulse" />
      <text x="0" y="4" font-family="'Segoe UI', sans-serif" font-size="11px" font-weight="700" fill="#00C6FF" text-anchor="middle">GROQ AI</text>
      
      <!-- Satellite Nodes -->
      <line x1="-32" y1="0" x2="-80" y2="-40" stroke="rgba(36, 123, 255, 0.5)" stroke-width="1.5" />
      <circle cx="-80" cy="-40" r="14" fill="#247BFF" />
      <text x="-80" y="-36" font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="700" fill="#FFFFFF" text-anchor="middle">Q&amp;A</text>

      <line x1="32" y1="0" x2="80" y2="-40" stroke="rgba(255, 53, 79, 0.5)" stroke-width="1.5" />
      <circle cx="80" cy="-40" r="14" fill="#FF354F" />
      <text x="80" y="-36" font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="700" fill="#FFFFFF" text-anchor="middle">GHOST</text>

      <line x1="-32" y1="0" x2="-80" y2="40" stroke="rgba(16, 185, 129, 0.5)" stroke-width="1.5" />
      <circle cx="-80" cy="40" r="14" fill="#10B981" />
      <text x="-80" y="44" font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="700" fill="#FFFFFF" text-anchor="middle">HUB</text>

      <line x1="32" y1="0" x2="80" y2="40" stroke="rgba(245, 158, 11, 0.5)" stroke-width="1.5" />
      <circle cx="80" cy="40" r="14" fill="#F59E0B" />
      <text x="80" y="44" font-family="'Segoe UI', sans-serif" font-size="9px" font-weight="700" fill="#FFFFFF" text-anchor="middle">XP</text>
    </g>
  </g>

  <!-- Right Platform Features Panel -->
  <g transform="translate(360, 85)">
    <rect x="0" y="0" width="450" height="180" rx="12" fill="#0F192E" stroke="rgba(36, 123, 255, 0.3)" stroke-width="1.5" />

    <g transform="translate(25, 25)">
      <text x="0" y="0" class="label-text">STUDENT AI TUTOR &amp; GHOST PROTOCOL</text>
      <text x="0" y="20" class="val-text">Groq Llama-3.3 70B &amp; Gemini Tutor + Anonymous Q&amp;A Feed</text>

      <line x1="0" y1="36" x2="400" y2="36" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="58" class="label-text">FACULTY MENTORSHIP &amp; TELEMETRY</text>
      <text x="0" y="76" class="val-text">Asynchronous Pipeline &amp; Recharts Query Analytics Dashboard</text>

      <line x1="0" y1="92" x2="400" y2="92" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="114" class="label-text">GAMIFICATION &amp; REWARD ENGINE</text>
      <text x="0" y="132" class="val-text">XP Reward Algorithm, Daily Streaks &amp; Live Campus Leaderboards</text>
    </g>
  </g>
</svg>