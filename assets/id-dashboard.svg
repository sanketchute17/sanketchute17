<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 420" width="100%" height="100%">
  <defs>
    <linearGradient id="idBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0D162A" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="idBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247BFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#FF354F" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="metallicChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3BD" />
      <stop offset="25%" stop-color="#CBD5E1" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="75%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <linearGradient id="lanyardRibbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF354F" />
      <stop offset="100%" stop-color="#247BFF" />
    </linearGradient>

    <linearGradient id="chipGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <pattern id="idDotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#247BFF" opacity="0.12" />
    </pattern>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .section-title {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #247BFF;
      text-transform: uppercase;
    }
    .main-heading {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 20px;
      font-weight: 800;
      fill: #F3F5FA;
    }
    .field-label {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 10px;
      font-weight: 700;
      fill: #9AA8BD;
      letter-spacing: 0.5px;
    }
    .field-val {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #F3F5FA;
    }
    .highlight-val {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 700;
      fill: #00C6FF;
    }
    .id-code {
      font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace;
      font-size: 10.5px;
      fill: #64748B;
    }
    .hanging-card-group {
      animation: gentleSwing 4s ease-in-out infinite alternate;
      transform-origin: 220px 80px;
    }
    .scan-line {
      animation: scanEffect 3s infinite linear;
    }
    @keyframes gentleSwing {
      0% { transform: rotate(-1.5deg); }
      100% { transform: rotate(1.5deg); }
    }
    @keyframes scanEffect {
      0% { transform: translateY(0px); opacity: 0; }
      50% { opacity: 0.6; }
      100% { transform: translateY(360px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .hanging-card-group, .scan-line { animation: none; }
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="410" rx="16" fill="url(#idBg)" />
  <rect x="5" y="5" width="840" height="410" rx="16" fill="url(#idDotPattern)" />
  <rect x="5" y="5" width="840" height="390" rx="16" fill="none" stroke="url(#idBorder)" stroke-width="2" />

  <!-- Scanner Line -->
  <line x1="10" y1="15" x2="840" y2="15" stroke="#247BFF" stroke-width="2" opacity="0.4" class="scan-line" filter="url(#badgeGlow)" />

  <!-- Clean Header -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" class="section-title">VERIFIED DEVELOPER CREDENTIALS</text>
    <text x="0" y="24" class="main-heading">Hanging Developer ID Badge Dossier</text>
  </g>

  <!-- Left Side Hanging ID Badge -->
  <g class="hanging-card-group">
    <!-- Lanyard Straps -->
    <path d="M 195 72 L 210 105 M 245 72 L 230 105" stroke="url(#lanyardRibbon)" stroke-width="12" stroke-linecap="round" opacity="0.85" />

    <!-- Metallic Clasp -->
    <rect x="205" y="100" width="30" height="14" rx="4" fill="url(#metallicChrome)" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="220" cy="107" r="4" fill="#070B16" />

    <!-- ID Card Body -->
    <g transform="translate(35, 140)">
      <rect x="0" y="0" width="370" height="250" rx="14" fill="#0F192E" stroke="rgba(36, 123, 255, 0.35)" stroke-width="1.5" />
      <rect x="0" y="0" width="370" height="4" rx="2" fill="#247BFF" />

      <!-- Punch Slot -->
      <rect x="165" y="-10" width="40" height="10" rx="5" fill="#070B16" stroke="url(#metallicChrome)" stroke-width="1.5" />

      <!-- Smart Chip & Tech Emblem -->
      <g transform="translate(18, 20)">
        <rect x="0" y="0" width="40" height="30" rx="5" fill="url(#chipGold)" />
        <line x1="0" y1="15" x2="40" y2="15" stroke="#B45309" stroke-width="1" />
        <line x1="20" y1="0" x2="20" y2="30" stroke="#B45309" stroke-width="1" />
        
        <text x="52" y="16" class="field-val" font-size="15px" font-weight="800">SANKET CHUTE</text>
        <text x="52" y="32" class="id-code">ID: SANKETCHUTE17 • VERIFIED</text>
      </g>

      <line x1="18" y1="68" x2="352" y2="68" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <!-- Verified Facts -->
      <g transform="translate(18, 84)">
        <text x="0" y="0" class="field-label">SOFTWARE ENGINEERING FOCUS</text>
        <text x="0" y="18" class="field-val">AI/ML • Physics Neural Networks</text>

        <text x="0" y="44" class="field-label">DEGREE &amp; CGPA</text>
        <text x="0" y="62" class="field-val">B.Tech AI (RTMNU) • <tspan class="highlight-val">8.2 CGPA</tspan></text>

        <text x="0" y="88" class="field-label">DIPLOMA (MSBTE)</text>
        <text x="0" y="106" class="field-val">Computer Eng • <tspan class="highlight-val">80.97%</tspan></text>

        <text x="0" y="130" class="field-label">GRADUATION &amp; LOCATION</text>
        <text x="0" y="144" class="field-val" font-size="10.5px">Expected 2027 • Nagpur, India</text>
      </g>

      <!-- Barcode Footer -->
      <g transform="translate(18, 232)">
        <line x1="0" y1="0" x2="334" y2="0" stroke="#247BFF" stroke-width="3" stroke-dasharray="2,4,8,2,6,3,2,7,4,2,8,3,2" opacity="0.7" />
      </g>
    </g>
  </g>

  <!-- Right Side Verified Academic Milestones Card -->
  <g transform="translate(425, 140)">
    <rect x="0" y="0" width="390" height="250" rx="14" fill="#0F192E" stroke="rgba(255, 53, 79, 0.35)" stroke-width="1.5" />
    <rect x="0" y="0" width="390" height="4" rx="2" fill="#FF354F" />

    <g transform="translate(22, 22)">
      <text x="0" y="0" class="field-label">ACADEMIC TIMELINE &amp; INSTITUTION</text>
      <text x="0" y="20" class="field-val">G. H. Raisoni College of Engineering</text>
      <text x="0" y="36" class="field-val" font-size="11px" fill="#9AA8BD">&amp; Management, Nagpur, Maharashtra</text>

      <line x1="0" y1="52" x2="346" y2="52" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="74" class="field-label">EDUCATION MILESTONES</text>
      <text x="0" y="92" class="field-val">1. B.Tech Artificial Intelligence (2023 – 2027)</text>
      <text x="0" y="110" class="field-val">2. Diploma Computer Engineering (2020 – 2023)</text>
      <text x="0" y="128" class="field-val">3. Verified Professional Dossier Records</text>

      <line x1="0" y1="144" x2="346" y2="144" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="166" class="field-label">VERIFICATION STATUS</text>
      <text x="0" y="184" class="field-val" fill="#00C6FF">• 100% Resume &amp; Academic Alignment</text>
      <text x="0" y="202" class="field-val" font-size="11px" fill="#10B981">✓ Official Dossier Records Checked</text>
    </g>
  </g>
</svg>