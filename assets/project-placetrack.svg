<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <linearGradient id="ptBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0C1324" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="ptBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#247BFF" stop-opacity="0.4" />
    </linearGradient>

    <pattern id="ptGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#10B981" opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title-text { font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace; font-size: 17px; font-weight: 800; fill: #F3F5FA; }
    .sub-title { font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace; font-size: 11px; font-weight: 700; fill: #10B981; letter-spacing: 1px; }
    .label-text { font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace; font-size: 10px; font-weight: 700; fill: #9AA8BD; }
    .val-text { font-family: 'Courier New', Courier, 'Lucida Console', Consolas, monospace; font-size: 11.5px; font-weight: 700; fill: #10B981; }
  </style>

  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#ptBg)" />
  <rect x="5" y="5" width="840" height="310" rx="16" fill="url(#ptGrid)" />
  <rect x="5" y="5" width="840" height="310" rx="16" fill="none" stroke="url(#ptBorder)" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(35, 32)">
    <text x="0" y="0" class="sub-title">FEATURED PLACEMENT TECH</text>
    <text x="0" y="24" class="title-text">PlaceTrack AI — Placement Hub &amp; ATS Analytics</text>
  </g>

  <!-- Left Side ATS Visual Diagram -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="300" height="180" rx="12" fill="#0F192E" stroke="rgba(16, 185, 129, 0.4)" stroke-width="1.5" />
    
    <g transform="translate(25, 20)">
      <!-- Resume Card -->
      <rect x="0" y="0" width="110" height="140" rx="8" fill="#070B16" stroke="#10B981" stroke-width="1.5" />
      <line x1="15" y1="20" x2="95" y2="20" stroke="#10B981" stroke-width="2" />
      <line x1="15" y1="35" x2="80" y2="35" stroke="#9AA8BD" stroke-width="1.5" />
      <line x1="15" y1="48" x2="90" y2="48" stroke="#9AA8BD" stroke-width="1.5" />
      <line x1="15" y1="61" x2="70" y2="61" stroke="#9AA8BD" stroke-width="1.5" />
      <circle cx="75" cy="100" r="22" fill="rgba(16, 185, 129, 0.15)" stroke="#10B981" stroke-width="1.5" />
      <text x="75" y="104" font-family="'Courier New', Courier, 'Lucida Console', Consolas, monospace" font-size="11px" font-weight="800" fill="#10B981" text-anchor="middle">94%</text>
      <text x="75" y="130" font-family="'Courier New', Courier, 'Lucida Console', Consolas, monospace" font-size="8px" fill="#9AA8BD" text-anchor="middle">ATS SCORE</text>

      <!-- Connection Arrow -->
      <path d="M 125 70 L 145 70" stroke="#00C6FF" stroke-width="2" stroke-dasharray="3,3" />

      <!-- Supabase Auth Node -->
      <rect x="155" y="25" width="95" height="90" rx="8" fill="#070B16" stroke="#00C6FF" stroke-width="1.5" />
      <text x="202" y="50" font-family="'Courier New', Courier, 'Lucida Console', Consolas, monospace" font-size="9px" font-weight="700" fill="#00C6FF" text-anchor="middle">JWT AUTH</text>
      <line x1="165" y1="60" x2="240" y2="60" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="202" y="80" font-family="'Courier New', Courier, 'Lucida Console', Consolas, monospace" font-size="9px" font-weight="700" fill="#10B981" text-anchor="middle">SUPABASE</text>
      <text x="202" y="94" font-family="'Courier New', Courier, 'Lucida Console', Consolas, monospace" font-size="8px" fill="#9AA8BD" text-anchor="middle">PostgreSQL</text>
    </g>
  </g>

  <!-- Right Side Panel -->
  <g transform="translate(350, 85)">
    <rect x="0" y="0" width="465" height="180" rx="12" fill="#0F192E" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1.5" />

    <g transform="translate(22, 25)">
      <text x="0" y="0" class="label-text">AUTOMATED ATS RESUME CHECKER</text>
      <text x="0" y="20" class="val-text">Keyword Match &amp; Score Calculation Engine</text>

      <line x1="0" y1="36" x2="420" y2="36" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="58" class="label-text">ROLE-BASED AUTHENTICATION &amp; ACCESS</text>
      <text x="0" y="76" class="val-text">Secure JWT Authorization &amp; Student Portals</text>

      <line x1="0" y1="92" x2="420" y2="92" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

      <text x="0" y="114" class="label-text">ENTERPRISE PLACEMENT ANALYTICS</text>
      <text x="0" y="132" class="val-text">Supabase PostgreSQL Database Query Pipelines</text>
    </g>
  </g>
</svg>