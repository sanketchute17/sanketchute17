<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 350" width="100%" height="100%">
  <defs>
    <linearGradient id="abBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B16" />
      <stop offset="50%" stop-color="#0C1324" />
      <stop offset="100%" stop-color="#070B16" />
    </linearGradient>

    <linearGradient id="abBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF354F" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#247BFF" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#FF354F" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F182E" />
      <stop offset="100%" stop-color="#090F1D" />
    </linearGradient>

    <pattern id="abDotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FF354F" opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .section-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #247BFF;
      text-transform: uppercase;
    }
    .main-heading {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 24px;
      font-weight: 800;
      fill: #F3F5FA;
    }
    .card-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #F3F5FA;
    }
    .card-body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 12.5px;
      fill: #9AA8BD;
      line-height: 1.5;
    }
    .pill-tag {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 10.5px;
      font-weight: 600;
      fill: #00C6FF;
    }
  </style>

  <!-- Container Box -->
  <rect x="5" y="5" width="840" height="340" rx="16" fill="url(#abBg)" />
  <rect x="5" y="5" width="840" height="340" rx="16" fill="url(#abDotPattern)" />
  <rect x="5" y="5" width="840" height="340" rx="16" fill="none" stroke="url(#abBorder)" stroke-width="2" />

  <!-- Section Header -->
  <g transform="translate(40, 32)">
    <text x="0" y="0" class="section-title">ENGINEERING FOCUS &amp; CAPABILITIES</text>
    <text x="0" y="24" class="main-heading">Bridging Artificial Intelligence with High-Performance Systems</text>
  </g>

  <!-- 3 Capability Cards (NO PERSONAL PHOTO) -->
  <g transform="translate(40, 90)">
    <!-- Card 1: AI & ML -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="245" height="215" rx="12" fill="url(#cardGrad1)" stroke="rgba(36, 123, 255, 0.25)" stroke-width="1.5" />
      <rect x="0" y="0" width="245" height="4" rx="2" fill="#247BFF" />
      
      <g transform="translate(20, 22)">
        <circle cx="16" cy="16" r="16" fill="rgba(36, 123, 255, 0.15)" />
        <path d="M 10 16 L 16 10 L 22 16 L 16 22 Z M 16 10 L 16 22 M 10 16 L 22 16" stroke="#247BFF" stroke-width="2" fill="none" />
      </g>
      
      <text x="20" y="70" class="card-title">AI &amp; Machine Learning</text>
      <text x="20" y="96" class="card-body">Architecting Physics-Informed</text>
      <text x="20" y="114" class="card-body">Neural Networks (PINN), LLM</text>
      <text x="20" y="132" class="card-body">tutors (Llama-3.3 70B &amp; Gemini),</text>
      <text x="20" y="150" class="card-body">CNN vision &amp; risk analytics.</text>
      
      <rect x="20" y="172" width="105" height="22" rx="6" fill="rgba(0, 198, 255, 0.1)" stroke="rgba(0, 198, 255, 0.3)" stroke-width="1" />
      <text x="26" y="187" class="pill-tag">PINN • LLM • CNN</text>
    </g>

    <!-- Card 2: Full-Stack Cloud -->
    <g transform="translate(262.5, 0)">
      <rect x="0" y="0" width="245" height="215" rx="12" fill="url(#cardGrad1)" stroke="rgba(255, 53, 79, 0.25)" stroke-width="1.5" />
      <rect x="0" y="0" width="245" height="4" rx="2" fill="#FF354F" />
      
      <g transform="translate(20, 22)">
        <circle cx="16" cy="16" r="16" fill="rgba(255, 53, 79, 0.15)" />
        <path d="M 9 11 L 16 7 L 23 11 L 16 15 Z M 9 16 L 16 20 L 23 16 M 9 21 L 16 25 L 23 21" stroke="#FF354F" stroke-width="2" fill="none" />
      </g>

      <text x="20" y="70" class="card-title">Full-Stack Cloud Apps</text>
      <text x="20" y="96" class="card-body">Building reactive interfaces in</text>
      <text x="20" y="114" class="card-body">React 18 &amp; TypeScript with</text>
      <text x="20" y="132" class="card-body">FastAPI / Express backends,</text>
      <text x="20" y="150" class="card-body">Web Bluetooth &amp; Docker.</text>

      <rect x="20" y="172" width="125" height="22" rx="6" fill="rgba(255, 53, 79, 0.1)" stroke="rgba(255, 53, 79, 0.3)" stroke-width="1" />
      <text x="26" y="187" class="pill-tag" fill="#FF6B81">React • Node • Docker</text>
    </g>

    <!-- Card 3: Systems & Data Engineering -->
    <g transform="translate(525, 0)">
      <rect x="0" y="0" width="245" height="215" rx="12" fill="url(#cardGrad1)" stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" />
      <rect x="0" y="0" width="245" height="4" rx="2" fill="#10B981" />
      
      <g transform="translate(20, 22)">
        <circle cx="16" cy="16" r="16" fill="rgba(16, 185, 129, 0.15)" />
        <ellipse cx="16" cy="11" rx="8" ry="4" stroke="#10B981" stroke-width="1.8" fill="none" />
        <path d="M 8 11 V 21 C 8 23 24 23 24 21 V 11" stroke="#10B981" stroke-width="1.8" fill="none" />
        <path d="M 8 16 C 8 18 24 18 24 16" stroke="#10B981" stroke-width="1.8" fill="none" />
      </g>

      <text x="20" y="70" class="card-title">Systems &amp; Database</text>
      <text x="20" y="96" class="card-body">Designing RESTful APIs, OOP</text>
      <text x="20" y="114" class="card-body">modular architectures, and</text>
      <text x="20" y="132" class="card-body">optimizing Firestore, MongoDB,</text>
      <text x="20" y="150" class="card-body">&amp; MySQL query pipelines.</text>

      <rect x="20" y="172" width="135" height="22" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
      <text x="26" y="187" class="pill-tag" fill="#10B981">REST • SQL • MongoDB</text>
    </g>
  </g>
</svg>